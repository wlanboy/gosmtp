name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            imapclient/go.sum
            smtpclient/go.sum

      - name: Vet server
        working-directory: server
        run: go vet ./...

      - name: Test server
        working-directory: server
        run: go test -v -race ./...

      - name: Build server
        working-directory: server
        run: go build -v ./...

      - name: Build imapclient
        working-directory: imapclient
        run: go build -v ./...

      - name: Build smtpclient
        working-directory: smtpclient
        run: go build -v ./...
