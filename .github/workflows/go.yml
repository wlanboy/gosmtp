name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            imapclient/go.sum
            smtpclient/go.sum

      - name: Vet server
        working-directory: server
        run: go vet ./...

      - name: Test server
        working-directory: server
        run: go test -v -race ./...

      - name: Build server
        working-directory: server
        run: go build -v ./...

      - name: Build imapclient
        working-directory: imapclient
        run: go build -v ./...

      - name: Build smtpclient
        working-directory: smtpclient
        run: go build -v ./...
